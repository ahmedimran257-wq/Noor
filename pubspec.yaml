name: silarah
description: "Silarah - Premium Muslim Matrimony App"
publish_to: 'none'
version: 1.0.0+27026

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  crypto: ^3.0.7                 # Verifies bundled moderation model integrity
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Design
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.7

  # Backend
  supabase_flutter: ^2.9.0
  firebase_core: ^3.8.0           # Firebase initialization
  firebase_auth: ^5.7.0           # SMS phone ownership for Premium/Guardian trust
  firebase_crashlytics: ^4.3.2   # Production crash reporting (free)
  purchases_flutter: ^10.8.0    # RevenueCat subscriptions and Test Store support
  firebase_messaging: ^15.2.0    # Push notifications via FCM (free & unlimited)
  uuid: ^4.5.1                   # Device ID generation

  # Localization
  intl: ^0.20.2

  # Utilities
  shared_preferences: ^2.3.3      # Locale + theme persistence
  flutter_secure_storage: ^10.3.1 # OAuth verifier/state survives process death securely
  image_picker: ^1.1.2            # Camera / Gallery photo picking
  flutter_image_compress: ^2.3.0  # Compress before upload
  google_mlkit_face_detection: ^0.11.1  # Compatible with text recognition ^0.13.0
  google_mlkit_object_detection: ^0.13.0 # On-device human-presence gate for profile photos
  tflite_flutter: ^0.12.1               # 16 KB-safe LiteRT runtime for file-backed NSFW moderation
  app_links: ^7.0.0                     # Verified Supabase auth callbacks
  url_launcher: ^6.3.2                  # Legal and support links
  path_provider: ^2.1.4                 # Temp dir for face detection

  # Networking
  http: ^1.2.2                    # Photon + Wikidata requests
  connectivity_plus: ^6.1.5      # Local link-state events; no metered backend polling

  # Media and motion
  flutter_animate: ^4.5.2         # City search dropdown animations
  cached_network_image: ^3.4.1    # Network image caching
  blurhash_dart: ^1.2.1          # BlurHash decode for photo placeholders
  image: ^4.3.0                  # Required by blurhash_dart for pixel buffer
  geolocator: ^14.0.3
  camera: ^0.12.0+1
  # Pinned: Android release integration is validated by CI before upgrades.
  package_info_plus: 10.2.0
  archive: ^4.0.9
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true                  # Enables flutter gen-l10n for AppLocalizations

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic

  # Assets
  assets:
    - assets/icon/
    - assets/models/opennsfw2_float16.tflite
    - assets/licenses/opennsfw2-MIT.txt

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21
