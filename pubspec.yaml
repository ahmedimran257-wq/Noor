name: noor
description: "NOOR (نور) — Premium Muslim Matrimony App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Design ────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ── State Management ──────────────────────────────────────
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # ── Navigation ────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Backend ───────────────────────────────────────────────
  supabase_flutter: ^2.9.0
  firebase_core: ^3.8.0           # Firebase initialization
  firebase_auth: ^5.3.2          # Phone OTP auth
  purchases_flutter: ^8.9.0     # RevenueCat subscriptions (v8 — Flutter v2 embedding)
  onesignal_flutter: ^5.2.7      # Push notifications (v5 — Flutter v2 embedding)
  uuid: ^4.5.1                   # Device ID generation

  # ── Localization ──────────────────────────────────────────
  intl: ^0.20.2

  # ── Utilities ─────────────────────────────────────────────
  shared_preferences: ^2.3.3      # Locale + theme persistence
  image_picker: ^1.1.2            # Camera / Gallery photo picking
  flutter_image_compress: ^2.3.0  # Compress before upload
  google_mlkit_face_detection: ^0.12.0  # On-device face detection (free)
  path_provider: ^2.1.4                 # Temp dir for face detection

  # ── Networking ──────────────────────────────────────────────
  http: ^1.2.2                    # REST Countries + Google Places API

  # ── Animations & Images ───────────────────────────────────
  flutter_animate: ^4.5.2         # City search dropdown animations
  cached_network_image: ^3.4.1    # Network image caching

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true                  # Enables flutter gen-l10n for AppLocalizations

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

  # ── Assets ───────────────────────────────────────────────────
  # Add local asset paths here when needed, e.g.:\n  # assets:
  #   - assets/images/
  #   - assets/icons/
