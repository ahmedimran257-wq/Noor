# ============================================================
# Supabase Project Configuration — Mithaq
# ============================================================

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
# Port to use for the email testing server web interface.
port = 54324
# Uncomment to expose additional ports for local app-level SMTP testing.
# smtp_port = 54325
# pop3_port = 54326
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
# profile-photos bucket is created via Supabase Dashboard or CLI:
# supabase storage create profile-photos --public=false

[storage.vector]
enabled = false

[auth]
site_url = "mithaq://"
additional_redirect_urls = ["https://mithaq.app"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "60s"
otp_expiry = 600
otp_length = 6

[auth.email.template.magic_link]
subject = "Your Mithaq verification code"
content_path = "./supabase/auth/email_templates/mithaq_verification_code.html"

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_before_user_created"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sms]
# Signup uses Supabase email OTP. SMS is disabled and reserved for later
# premium phone verification/trust checks outside the signup flow.
enable_signup = false
enable_confirmations = false

[realtime]
enabled = true
# Broadcast channels used for chat (match:{match_id})
# Presence channels used for online indicator (future Phase 2)

[functions]
# Edge Functions are in supabase/functions/
# Deploy all with: supabase functions deploy

[functions.auth-before-user-created]
# Supabase Auth calls this endpoint before an anonymous user session exists.
verify_jwt = false

[functions.revenuecat-webhook]
# RevenueCat signs requests with REVENUECAT_WEBHOOK_SECRET; Supabase JWT
# verification must stay off so external webhooks can reach our own verifier.
verify_jwt = false
