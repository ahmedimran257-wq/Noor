# ============================================================
# Supabase Project Configuration — Silarah
# ============================================================

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
# Port to use for the email testing server web interface.
port = 54324
# Uncomment to expose additional ports for local app-level SMTP testing.
# smtp_port = 54325
# pop3_port = 54326
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
# profile-photos bucket is created via Supabase Dashboard or CLI:
# supabase storage create profile-photos --public=false

[storage.vector]
enabled = false

[auth]
site_url = "https://silarah.com"
additional_redirect_urls = [
  "https://silarah.com/auth/callback",
  "https://app.silarah.com/auth/callback"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "60s"
otp_expiry = 600
otp_length = 6

# Project-wide Auth email allowance. Brevo remains the final provider-level
# authority, while max_frequency above prevents repeated sends to one address.
[auth.rate_limit]
email_sent = 100

[auth.email.smtp]
enabled = true
host = "smtp-relay.brevo.com"
port = 587
user = "af75c6001@smtp-brevo.com"
pass = "env(SILARAH_SMTP_PASSWORD)"
admin_email = "noreply@mail.silarah.com"
sender_name = "Silarah"

[auth.email.template.magic_link]
subject = "Your Silarah sign-in code"
content_path = "./supabase/auth/email_templates/silarah_verification_code.html"

# First-time passwordless signup can be classified as an account
# confirmation by GoTrue. Keep it on the exact same numeric OTP contract so a
# hosted default containing {{ .ConfirmationURL }} can never leak into signup.
[auth.email.template.confirmation]
subject = "Welcome to Silarah | Verify your email"
content_path = "./supabase/auth/email_templates/silarah_welcome_verification_code.html"

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_before_user_created"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sms]
# Signup uses Supabase email OTP. SMS is disabled and reserved for later
# premium phone verification/trust checks outside the signup flow.
enable_signup = false
enable_confirmations = false

[realtime]
enabled = true
# Broadcast channels used for chat (match:{match_id})
# Presence channels used for online indicator (future Phase 2)

[functions]
# Edge Functions are in supabase/functions/
# Deploy all with: supabase functions deploy

[functions.location-search]
# Typed location data is proxied through an authenticated, rate-limited
# boundary instead of being disclosed directly from the member's device.
verify_jwt = true

[functions.health-probe]
# Exact, content-validated connectivity probe under Silarah's backend.
verify_jwt = false

[functions.dispatch-notifications]
# Private pg_cron calls authenticate with the Vault-backed x-cron-secret;
# direct member calls are independently verified inside the function.
verify_jwt = false
import_map = "./functions/deno.json"

[functions.revenuecat-webhook]
# RevenueCat signs requests with REVENUECAT_WEBHOOK_SECRET; Supabase JWT
# verification must stay off so external webhooks can reach our own verifier.
verify_jwt = false

[functions.brevo-key-keepalive]
# pg_cron authenticates with the private Vault-backed cron credential.
verify_jwt = false

[functions.photo-verification]
# Member JWT is revalidated inside the function before private upload grants.
verify_jwt = true

[functions.purge-photo-verification-captures]
# Private pg_cron request authenticated by the Vault-backed cron credential.
verify_jwt = false

[functions.storage-lifecycle-worker]
# Private pg_cron request authenticated by the Vault-backed cron credential.
verify_jwt = false

[functions.admin-purge-deleted-users]
# Private pg_cron request authenticated by the Vault-backed cron credential.
verify_jwt = false
