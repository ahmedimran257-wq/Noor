name: Staging 600-1000 user capacity test

on:
  workflow_dispatch:
    inputs:
      peak_vus:
        description: "Peak concurrent virtual users (staging only)"
        required: true
        default: "600"
        type: choice
        options:
          - "600"
          - "800"
          - "1000"
      confirm_staging_only:
        description: "I confirm this must run only against disposable staging data"
        required: true
        default: false
        type: boolean

concurrency:
  group: staging-scale-load-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  capacity:
    name: Ramp through 600 to ${{ inputs.peak_vus }} concurrent users
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - name: Require explicit staging confirmation
        shell: bash
        run: test "${{ inputs.confirm_staging_only }}" = "true"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20.19.5"
      - name: Install pinned k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
      - name: Run production-refusing staged capacity test
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
          PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
          LOAD_TEST_PROFILE: scale
          LOAD_TEST_MAX_VUS: ${{ inputs.peak_vus }}
          LOAD_TEST_SCALE_ACK: I_UNDERSTAND_STAGING_SCALE_LOAD
          STAGING_LOAD_REPORT_PATH: build/staging-scale-summary.json
        run: node tool/run_staging_load_test.mjs
      - name: Upload capacity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-capacity-${{ inputs.peak_vus }}-vus
          path: build/staging-scale-summary.json
          if-no-files-found: error
          retention-days: 30
