name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.11"
      - name: Scan repository for committed live config
        run: python tool/secret_scan.py

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.4"
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Check Dart formatting
        run: dart format --set-exit-if-changed lib test
      - name: Analyze Flutter app
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test --dart-define-from-file=config/dart_defines.example.json
      - name: Create CI-only Android signing identity
        shell: bash
        run: |
          signing_dir="$HOME/.silarah/release-signing"
          mkdir -p "$signing_dir"
          keytool -genkeypair -noprompt \
            -keystore "$signing_dir/ci-upload.jks" \
            -storetype JKS \
            -storepass ci-release-build-only \
            -keypass ci-release-build-only \
            -alias silarah-ci \
            -keyalg RSA \
            -keysize 3072 \
            -validity 2 \
            -dname "CN=Silarah CI, O=Silarah, C=IN"
          {
            echo "storeFile=$signing_dir/ci-upload.jks"
            echo "storePassword=ci-release-build-only"
            echo "keyAlias=silarah-ci"
            echo "keyPassword=ci-release-build-only"
          } > "$signing_dir/key.properties"
          chmod 600 "$signing_dir/key.properties" "$signing_dir/ci-upload.jks"
      - name: Verify release signing cannot use the debug identity
        working-directory: android
        run: ./gradlew verifyReleaseSigning
      - name: Build Android release bundle
        run: |
          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          flutter build appbundle --release --dart-define-from-file=config/dart_defines.example.json

  admin:
    name: Admin lint, typecheck, build, audit
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: admin
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_ADMIN_SITE_URL: http://localhost:3001
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      ADMIN_LOGIN_HASH_SALT: ci-placeholder-salt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20.19.5"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install admin dependencies
        run: npm ci
      - name: Lint admin panel
        run: npm run lint
      - name: Typecheck admin panel
        run: npm run typecheck
      - name: Build admin panel
        run: npm run build
      - name: Verify production admin security headers
        run: npm run test:security-headers
      - name: Audit admin production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  supabase:
    name: Supabase migrations and functions
    runs-on: ubuntu-latest
    needs: secret-scan
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.11"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.8.1"
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: "2.110.0"
      - name: Validate migration files
        run: python tool/validate_supabase_migrations.py
      - name: Start fresh local Supabase
        run: supabase start
      - name: Apply every migration to a clean database
        run: supabase db reset --local
      - name: Run database authorization and integrity tests
        run: supabase test db
      - name: Check Edge Function formatting
        run: deno fmt --check --config supabase/functions/deno.json supabase/functions
      - name: Typecheck Edge Functions
        run: |
          find supabase/functions -name 'index.ts' -print0 \
            | xargs -0 -n1 deno check \
                --config supabase/functions/deno.json \
                --lock supabase/deno.lock \
                --frozen
      - name: Lint Edge Functions
        run: deno lint --config supabase/functions/deno.json supabase/functions
      - name: Test Edge Functions
        run: >-
          deno test --allow-env --allow-net
          --config supabase/functions/deno.json
          --lock supabase/deno.lock
          --frozen
          supabase/functions
      - name: Validate linked Supabase migration plan
        shell: bash
        run: |
          if [[ -n "${SUPABASE_ACCESS_TOKEN}" && -n "${SUPABASE_PROJECT_REF}" ]]; then
            supabase link --project-ref "${SUPABASE_PROJECT_REF}"
            supabase db push --dry-run
          else
            echo "Skipping Supabase db push dry-run; configure SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets to enable it."
          fi
